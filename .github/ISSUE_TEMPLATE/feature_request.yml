name: Feature request
description: Propose an improvement that preserves the add-only design.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow and affected platform.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the change, alternatives, and any permission or enforcement implications.
    validations:
      required: true
