name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Swift tests and unsigned builds
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Regression tests
        run: ./scripts/test.sh
      - name: Build the Mac app without developer credentials
        run: ./OneWayMac/build.sh --unsigned
      - name: Compile the iPhone app for Simulator
        run: >-
          xcodebuild -project OneWay/OneWay.xcodeproj -scheme OneWay
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath OneWay/.build/CI CODE_SIGNING_ALLOWED=NO build
      - name: Check formatting errors
        run: git diff --check
